# ServiceAccount for the investing pod. Annotated with the Azure client ID
# of infra-shared-identity (federated to this SA by infra-bootstrap's tofu)
# rather than the per-app investing-identity. infra-shared-identity has
# the Cosmos + App Config access this pod needs.
#
# Auth itself doesn't require any Azure resource access — sessions are
# delegated to auth.romaine.life via cookie forward (backend/auth.js), not
# verified locally with a per-app secret.
#
# Switching to investing-identity (defined in tofu/identity.tf) is a
# nice-to-have for tighter blast radius, but doesn't change behavior;
# punted to a future PR that also updates the annotation with the right
# client_id.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-shared
  namespace: investing
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: de23a2e0-705a-4a69-9f2e-2b56cc859659
