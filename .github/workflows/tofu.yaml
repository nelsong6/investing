name: Infrastructure

on:
  pull_request:
    branches: [main]
    paths: ['tofu/**']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Run a tofu destroy plan instead of a normal plan. Use to retire the app.'
        type: boolean
        default: false

concurrency:
  group: tofu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  tofu:
    uses: romaine-life/pipeline-templates/.github/workflows/tofu-plan-apply-template.yml@main
    with:
      working_directory: tofu
      backend_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      backend_key: investing.tfstate
      # Only honor `destroy` when the workflow was manually dispatched —
      # prevents a push to main from accidentally tearing everything down.
      destroy: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy == true }}
    secrets: inherit
